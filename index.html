<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Melon MP4 轉換器</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="wrap">
  <header>
    <h1>Melon MP4 轉換器</h1>
    <p>影片 → 168 幀 → Melon Playground 影片存檔</p>
  </header>

  <section class="card">
    <label class="drop" for="file">
      <b id="fileName">選擇影片</b>
      <span id="fileInfo">MP4 / MOV / WebM</span>
    </label>
    <input id="file" type="file" accept="video/*">
    <video id="video" muted playsinline></video>
    <canvas id="canvas" width="392" height="180"></canvas>
    <img id="preview" class="preview">

    <div class="setting">
      <label>JPEG 畫質</label>
      <input id="quality" type="range" min="35" max="95" value="72">
      <span id="qualityText">72%</span>
    </div>
    <div class="tags"><span>168 幀</span><span>392 × 180</span></div>
    <button id="convert" disabled>開始轉換</button>
    <div class="progress"><i id="bar"></i></div>
    <p id="status">等待影片。</p>
  </section>

  <section class="card" id="downloads" hidden>
    <h2>轉換完成</h2>
    <p>兩個檔案都要匯入 Melon Playground，檔名請保持不變。</p>
    <button class="secondary" id="downloadVideo">下載 gb.melsave</button>
    <button class="secondary" id="downloadPlayer">下載 gb mp4.melsave</button>
  </section>

  <section class="card credits">
    <h2>原作資訊</h2>
    <p>保留「影片播放器 2.0」原作者的播放器 Lua、物件結構、播放方式與原始資源；本網站只負責把使用者影片轉換成相容的影格存檔。</p>
    <p><b>播放器原作／原始資源：原檔作者</b><br>網頁轉換器：依原作格式逆向製作。</p>
  </section>
</main>
<script src="app.js"></script>
</body>
</html>
